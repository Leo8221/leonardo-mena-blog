name: Actualizar Observatorio

on:
  push:
    branches:
      - main
    paths:
      - "**.qmd"
      - "_quarto.yml"
      - "styles.css"
      - "assets/**"
      - "atlas/**"
      - "datos/**"
      - "images/**"
      - "posts/**"
      - "reading-progress.html"
      - "share-buttons-auto.html"
      - "skip-link.html"
      - ".github/workflows/actualizar_observatorio.yml"
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-blog:
    runs-on: ubuntu-latest

    env:
      RENV_CONFIG_PAK_ENABLED: true

    steps:
      - name: Chequear codigo
        uses: actions/checkout@v4

      - name: Instalar Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.9.38

      - name: Instalar R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libgdal-dev \
            libgeos-dev \
            libproj-dev \
            libudunits2-dev

      - name: Instalar y cachear paquetes R
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::tidyverse
            any::highcharter
            any::readxl
            any::lubridate
            any::httr
            any::janitor
            any::DT
            any::htmltools
            any::bslib
            any::bsicons
            any::rmarkdown
            any::knitr
            any::here
            any::showtext
            any::scales
            any::patchwork
            any::ggrepel
            any::sf
            any::stringi
            any::jsonlite
            any::tidyquant
            any::rnaturalearth
            any::rnaturalearthdata
            any::treemapify

      - name: Limpiar caches de Quarto
        run: |
          rm -rf _freeze/
          rm -rf observatorio_cache/
          rm -rf *_cache/

      - name: Regenerar datos del Atlas
        run: |
          Rscript atlas/scripts/fetch-atlas-sources.R
          Rscript atlas/scripts/build-bcrd-live-data.R
          Rscript atlas/scripts/build-map-assets.R
          Rscript atlas/scripts/build-article-visuals.R
          node atlas/scripts/build-atlas-data.mjs

      - name: Renderizar proyecto
        run: quarto render --no-cache

      - name: Asegurar Atlas en sitemap
        run: node atlas/scripts/ensure-sitemap.mjs

      - name: Validar texto publicado
        run: node atlas/scripts/check-text-integrity.mjs --include-docs

      - name: Validar contrato del sitio
        run: node atlas/scripts/check-site-contract.mjs --include-docs

      - name: Guardar cambios
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Auto-update: $(date +'%Y-%m-%d %H:%M UTC')"
            git push
            echo "Publicado"
          fi
