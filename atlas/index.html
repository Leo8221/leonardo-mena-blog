<body>
  <a class="skip-link" href="#atlas-main">Saltar al contenido</a>
  <div class="atlas-app" data-view="overview">
    <aside class="atlas-sidebar" id="atlas-sidebar" aria-label="Navegación del Atlas">
      <a class="brand-lockup" href="./" aria-label="Atlas">
        <span>
          <strong>Atlas</strong>
          <small>Datos y gráficos del blog</small>
        </span>
      </a>

      <div class="search-box">
        <label for="atlas-search">Buscar módulo</label>
        <div class="search-control">

        </div>
        <p class="search-results-count" id="atlas-result-count" aria-live="polite"></p>
      </div>

      <div class="filter-group" aria-label="Filtros por familia">
        <button class="filter-pill is-active" type="button" data-filter="all">Todos</button>
        <button class="filter-pill" type="button" data-filter="Macro">Macro</button>
        <button class="filter-pill" type="button" data-filter="Sectores">Sectores</button>

        <button class="filter-pill" type="button" data-filter="Trabajo">Trabajo</button>
        <button class="filter-pill" type="button" data-filter="Precios">Precios</button>
        <button class="filter-pill" type="button" data-filter="Territorio">Territorio</button>
        <button class="filter-pill" type="button" data-filter="Empresas">Empresas</button>
        <button class="filter-pill" type="button" data-filter="Visuales">Visuales</button>
      </div>

      <nav class="module-nav" id="module-nav" aria-label="Módulos del Atlas"></nav>

    </aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop" hidden></div>

    <main class="atlas-main" id="atlas-main" tabindex="-1">
      <header class="atlas-topbar">
        <button class="menu-toggle" id="menu-toggle" type="button" aria-expanded="false" aria-controls="atlas-sidebar">Menú</button>
        <div class="topbar-title">
          <h1>Atlas</h1>
          <p>Datos, mapas y gráficos del blog</p>
        </div>
        <div class="topbar-actions">
          <a href="../">Blog</a>
          <a href="../archivo.html">Archivo</a>
          <button class="atlas-theme-toggle" id="atlas-theme-toggle" type="button" aria-label="Alternar modo oscuro" title="Alternar modo oscuro"></button>
          <button class="topbar-tour" id="atlas-tour-start" type="button">Guía</button>
        </div>
      </header>

      <section class="mobile-atlas-nav" aria-label="Navegación móvil del Atlas">
        <div class="mobile-filter-row" aria-label="Filtros por familia">
          <button class="filter-pill is-active" type="button" data-filter="all">Todos</button>
          <button class="filter-pill" type="button" data-filter="Macro">Macro</button>
          <button class="filter-pill" type="button" data-filter="Sectores">Sectores</button>
          <button class="filter-pill" type="button" data-filter="Comercio">Comercio</button>
          <button class="filter-pill" type="button" data-filter="Trabajo">Trabajo</button>
          <button class="filter-pill" type="button" data-filter="Precios">Precios</button>
          <button class="filter-pill" type="button" data-filter="Territorio">Territorio</button>
          <button class="filter-pill" type="button" data-filter="Empresas">Empresas</button>
          <button class="filter-pill" type="button" data-filter="Visuales">Visuales</button>
        </div>
        <nav class="mobile-module-nav" id="mobile-module-nav" aria-label="Vistas del Atlas"></nav>
      </section>

      <section class="metric-strip" id="metric-strip" aria-label="Indicadores principales del Atlas"></section>

      <section class="workspace-grid">
        <div class="sr-only" id="atlas-status" role="status" aria-live="polite"></div>
        <section class="module-stage" id="module-stage" aria-busy="true"></section>
      </section>
    </main>
