<script>
(() => {
  const STORAGE_KEY = "lm_site_tour_seen_v1";
  const TOUR_ID = "lm-site-tour";

  if (document.getElementById(TOUR_ID)) {
    return;
  }

  const text = {
    start: "Guía",
    close: "Cerrar",
    prev: "Atras",
    next: "Siguiente",
    done: "Listo"
  };

  const candidates = [
    {
      selector: "#quarto-header",
      surface: "all",
      title: "Navegacion",
      body: "Las rutas principales estan aqui: analisis, Atlas, escuela y archivo."
    },
    {
      selector: 'a[href$="atlas/index.html"], a[href*="/atlas/"]',
      surface: "all",
      title: "Atlas",
      body: "La mesa de datos vive separada del blog, pero conectada con los articulos."
    },
    {
      selector: "#quarto-search, .aa-DetachedSearchButton",
      surface: "all",
      title: "Buscar",
      body: "Sirve para volver rapido a temas como deuda, precios, turismo o MiPyMES."
    },
    {
      selector: ".home-hero",
      surface: "home",
      title: "Portada",
      body: "La portada resume la idea del sitio y deja cerca el acceso al Atlas."
    },
    {
      selector: "#listing-home-featured .quarto-grid-item.card, #listing-home-featured .card, #home-featured .card",
      surface: "home",
      title: "Ultimo analisis",
      body: "El articulo mas reciente aparece primero para lectores que vuelven."
    },
    {
      selector: "#listing-home-latest .g-col-1:first-child .quarto-grid-item.card, #listing-home-latest .g-col-1:first-child, #home-latest .card",
      surface: "home",
      title: "Archivo vivo",
      body: "Aqui se descubren publicaciones recientes sin entrar al archivo completo."
    },
    {
      selector: ".quarto-title, header.quarto-title-block",
      surface: "article",
      title: "Articulo",
      body: "Cada texto abre con tema, resumen y metadatos para ubicar la lectura."
    },
    {
      selector: "#quarto-document-content",
      surface: "article",
      title: "Lectura",
      body: "El cuerpo prioriza lectura tranquila; los graficos pueden ampliarse cuando conviene."
    },
    {
      selector: "figure, .quarto-float",
      surface: "article",
      title: "Graficos",
      body: "Las figuras acompanan el argumento y mantienen fuente o contexto cerca."
    }
  ];

  const currentSurface = document.querySelector(".home-shell")
    ? "home"
    : document.body.classList.contains("editorial-post") || document.querySelector("header.quarto-title-block")
      ? "article"
      : "page";

  if (currentSurface === "article") {
    return;
  }

  const isVisible = (element) => {
    if (!element) return false;
    const rect = element.getBoundingClientRect();
    const style = window.getComputedStyle(element);
    return rect.width > 8 && rect.height > 8 && style.display !== "none" && style.visibility !== "hidden";
  };

  const steps = candidates
    .filter((step) => step.surface === "all" || step.surface === currentSurface)
    .map((step) => ({ ...step, element: document.querySelector(step.selector) }))
    .filter((step) => isVisible(step.element));

  if (!steps.length) return;

  const trigger = document.createElement("button");
  trigger.type = "button";
  trigger.className = "site-tour-trigger";
  trigger.textContent = text.start;
  trigger.setAttribute("aria-label", "Abrir guia rapida del sitio");
  if (!localStorage.getItem(STORAGE_KEY)) {
    trigger.dataset.new = "true";
  }
  document.body.appendChild(trigger);

  const layer = document.createElement("div");
  layer.id = TOUR_ID;
  layer.className = "site-tour";
  layer.hidden = true;
  layer.innerHTML = `
    <div class="site-tour-shade site-tour-shade-top"></div>
    <div class="site-tour-shade site-tour-shade-right"></div>
    <div class="site-tour-shade site-tour-shade-bottom"></div>
    <div class="site-tour-shade site-tour-shade-left"></div>
    <div class="site-tour-ring" aria-hidden="true"></div>
    <section class="site-tour-popover" role="dialog" aria-modal="true" aria-labelledby="site-tour-title">
      <button class="site-tour-close" type="button">${text.close}</button>
      <p class="site-tour-count"></p>
      <h2 id="site-tour-title"></h2>
      <p class="site-tour-body"></p>
      <div class="site-tour-actions">
        <button class="site-tour-prev" type="button">${text.prev}</button>
        <button class="site-tour-next" type="button">${text.next}</button>
      </div>
    </section>
  `;
  document.body.appendChild(layer);

  const parts = {
    top: layer.querySelector(".site-tour-shade-top"),
    right: layer.querySelector(".site-tour-shade-right"),
    bottom: layer.querySelector(".site-tour-shade-bottom"),
    left: layer.querySelector(".site-tour-shade-left"),
    ring: layer.querySelector(".site-tour-ring"),
    popover: layer.querySelector(".site-tour-popover"),
    close: layer.querySelector(".site-tour-close"),
    count: layer.querySelector(".site-tour-count"),
    title: layer.querySelector("#site-tour-title"),
    body: layer.querySelector(".site-tour-body"),
    prev: layer.querySelector(".site-tour-prev"),
    next: layer.querySelector(".site-tour-next")
  };

  let index = 0;
  let returnFocus = null;

  const clamp = (value, min, max) => Math.max(min, Math.min(value, max));

  function setShade(element, top, left, width, height) {
    Object.assign(element.style, {
      top: `${top}px`,
      left: `${left}px`,
      width: `${width}px`,
      height: `${height}px`
    });
  }

  function placeStep() {
    const step = steps[index];
    const previousScrollBehavior = document.documentElement.style.scrollBehavior;
    document.documentElement.style.scrollBehavior = "auto";
    step.element.scrollIntoView({ block: "center", inline: "nearest", behavior: "instant" });
    document.documentElement.style.scrollBehavior = previousScrollBehavior;

    window.setTimeout(() => window.requestAnimationFrame(() => {
      const viewportWidth = window.innerWidth;
      const viewportHeight = window.innerHeight;
      const rect = step.element.getBoundingClientRect();
      const pad = 8;
      const top = clamp(rect.top - pad, 8, viewportHeight - 24);
      const left = clamp(rect.left - pad, 8, viewportWidth - 24);
      const right = clamp(rect.right + pad, 24, viewportWidth - 8);
      const bottom = clamp(rect.bottom + pad, 24, viewportHeight - 8);
      const width = Math.max(16, right - left);
      const height = Math.max(16, bottom - top);

      setShade(parts.top, 0, 0, viewportWidth, top);
      setShade(parts.left, top, 0, left, height);
      setShade(parts.right, top, right, viewportWidth - right, height);
      setShade(parts.bottom, bottom, 0, viewportWidth, viewportHeight - bottom);
      Object.assign(parts.ring.style, {
        top: `${top}px`,
        left: `${left}px`,
        width: `${width}px`,
        height: `${height}px`
      });

      parts.title.textContent = step.title;
      parts.body.textContent = step.body;
      parts.count.textContent = `${index + 1} de ${steps.length}`;
      parts.prev.disabled = index === 0;
      parts.next.textContent = index === steps.length - 1 ? text.done : text.next;

      const popoverWidth = Math.min(340, viewportWidth - 32);
      const popoverHeight = Math.min(parts.popover.offsetHeight || 210, viewportHeight - 32);
      const preferredTop = bottom + 18 + popoverHeight <= viewportHeight - 16
        ? bottom + 18
        : top - popoverHeight - 18;
      Object.assign(parts.popover.style, {
        width: `${popoverWidth}px`,
        left: `${clamp(left, 16, viewportWidth - popoverWidth - 16)}px`,
        top: `${clamp(preferredTop, 16, viewportHeight - popoverHeight - 16)}px`,
        bottom: "auto"
      });
    }), 80);
  }

  function openTour() {
    returnFocus = document.activeElement;
    localStorage.setItem(STORAGE_KEY, "1");
    delete trigger.dataset.new;
    layer.hidden = false;
    document.body.classList.add("site-tour-open");
    placeStep();
    parts.close.focus({ preventScroll: true });
  }

  function closeTour() {
    layer.hidden = true;
    document.body.classList.remove("site-tour-open");
    if (returnFocus && typeof returnFocus.focus === "function") {
      returnFocus.focus({ preventScroll: true });
    }
  }

  function move(delta) {
    if (index === steps.length - 1 && delta > 0) {
      closeTour();
      return;
    }
    index = clamp(index + delta, 0, steps.length - 1);
    placeStep();
    parts.close.focus({ preventScroll: true });
  }

  trigger.addEventListener("click", openTour);
  parts.close.addEventListener("click", closeTour);
  parts.prev.addEventListener("click", () => move(-1));
  parts.next.addEventListener("click", () => move(1));
  layer.querySelectorAll(".site-tour-shade").forEach((shade) => shade.addEventListener("click", closeTour));

  document.addEventListener("keydown", (event) => {
    if (layer.hidden) return;
    if (event.key === "Escape") closeTour();
    if (event.key === "ArrowRight") move(1);
    if (event.key === "ArrowLeft") move(-1);
    if (event.key === "Tab" && !parts.popover.contains(document.activeElement)) {
      event.preventDefault();
      parts.close.focus({ preventScroll: true });
    }
  });

  window.addEventListener("resize", () => {
    if (!layer.hidden) placeStep();
  });
})();
</script>
