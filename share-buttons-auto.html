<script>
(() => {
  if (window.__lmShareButtonsReady) return;
  window.__lmShareButtonsReady = true;

  function feedback(container, message) {
    let status = container.querySelector('[data-share-feedback]');
    if (!status) {
      status = document.createElement('span');
      status.className = 'share-copy-feedback';
      status.dataset.shareFeedback = '';
      status.setAttribute('role', 'status');
      status.setAttribute('aria-live', 'polite');
      container.append(status);
    }
    status.textContent = message;
    clearTimeout(status.timer);
    status.timer = setTimeout(() => { status.textContent = ''; }, 2200);
  }

  // Un permiso denegado no debe impedir copiar: se prueba la selección nativa.
  // Si tampoco funciona, el manejador muestra el enlace seleccionado para copiarlo manualmente.
  async function copyLink(url) {
    try {
      await navigator.clipboard.writeText(url);
      return true;
    } catch {
      const input = document.createElement('textarea');
      input.value = url;
      input.readOnly = true;
      input.style.cssText = 'position:fixed;left:-9999px;opacity:0';
      document.body.append(input);
      input.select();
      try {
        return document.execCommand('copy');
      } catch {
        return false;
      } finally {
        input.remove();
      }
    }
  }

  function showCopyField(container, url) {
    let wrapper = container.querySelector('[data-share-manual-copy]');
    if (!wrapper) {
      wrapper = document.createElement('span');
      wrapper.className = 'share-manual-copy';
      wrapper.dataset.shareManualCopy = '';
      wrapper.innerHTML = '<input type="text" readonly aria-label="Enlace para copiar manualmente">';
      container.append(wrapper);
    }
    const input = wrapper.querySelector('input');
    input.value = url;
    input.focus();
    input.select();
  }

  function setup() {
    const content = document.getElementById('quarto-document-content');
    if (document.body.classList.contains('editorial-post') && content && !document.querySelector('.share-minimal')) {
      content.insertAdjacentHTML('beforeend', `
        <div class="share-minimal"><p>Compartir en
          <a data-share="linkedin">LinkedIn</a>, <a data-share="twitter">X</a>
          o <a data-share="whatsapp">WhatsApp</a>.
        </p></div>
      `);
    }

    const title = (document.querySelector('h1.title, h1')?.textContent || document.title).trim();
    const canonical = document.querySelector('link[rel="canonical"]')?.href;
    const url = new URL(canonical || location.href);
    url.hash = '';
    url.search = '';
    url.pathname = url.pathname.replace(/\/index\.html$/, '/');
    const text = encodeURIComponent(`${title}\n\n${url}`);
    const platforms = {
      twitter: [`https://x.com/intent/post?text=${text}`, 'Compartir en X'],
      linkedin: [`https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(url)}`, 'Compartir en LinkedIn'],
      whatsapp: [`https://wa.me/?text=${text}`, 'Compartir por WhatsApp']
    };
    document.querySelectorAll('[data-share]').forEach(link => {
      const platform = platforms[link.dataset.share];
      if (!platform) return;
      [link.href, link.title] = platform;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      link.setAttribute('aria-label', link.title);
      link.removeAttribute('data-original-href');
    });

    document.querySelectorAll('.share-minimal').forEach(container => {
      const controls = document.createElement('span');
      controls.className = 'share-extra-controls';
      controls.innerHTML = `
        ${navigator.share ? '<button type="button" class="share-native-button" aria-label="Compartir este artículo">Compartir</button>' : ''}
        <button type="button" class="share-copy-button" aria-label="Copiar enlace del artículo">Copiar enlace</button>
      `;
      controls.addEventListener('click', async event => {
        const button = event.target.closest('button');
        if (!button) return;
        if (button.classList.contains('share-native-button')) {
          try {
            await navigator.share({title, url: url.href});
          } catch (error) {
            if (error.name !== 'AbortError') feedback(container, 'No se pudo compartir');
          }
        } else if (await copyLink(url.href)) {
          feedback(container, 'Enlace copiado');
        } else {
          showCopyField(container, url.href);
          feedback(container, 'Enlace listo para copiar');
        }
      });
      container.append(controls);
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', setup, {once:true});
  else setup();
})();
</script>
