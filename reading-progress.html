<script>
(function () {
  if (!document.body.classList.contains("editorial-post")) {
    return;
  }

  if (document.getElementById("reading-progress")) {
    return;
  }

  const progressBar = document.createElement("div");
  progressBar.id = "reading-progress";
  progressBar.setAttribute("aria-hidden", "true");
  document.body.prepend(progressBar);

  const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
  let ticking = false;

  function applyMotionPreference() {
    progressBar.style.transition = reducedMotion.matches ? "none" : "";
  }

  function updateProgress() {
    const documentHeight = Math.max(
      document.documentElement.scrollHeight,
      document.body.scrollHeight
    );
    const maxScroll = documentHeight - window.innerHeight;
    const rawProgress = maxScroll > 0 ? (window.scrollY / maxScroll) * 100 : 0;
    const progress = Math.min(100, Math.max(0, rawProgress));

    progressBar.style.width = `${progress}%`;
    ticking = false;
  }

  function requestUpdate() {
    if (!ticking) {
      window.requestAnimationFrame(updateProgress);
      ticking = true;
    }
  }

  applyMotionPreference();
  requestUpdate();

  window.addEventListener("scroll", requestUpdate, { passive: true });
  window.addEventListener("resize", requestUpdate);

  if (reducedMotion.addEventListener) {
    reducedMotion.addEventListener("change", applyMotionPreference);
  }
})();
</script>
