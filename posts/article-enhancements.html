<script>
(function () {
  // Quarto incluye este bloque después del artículo. No toca sus datos ni sus
  // gráficos: añade tiempo de lectura, controles de ampliación y sincroniza Giscus.
  const body = document.body;
  if (!body || !body.classList.contains("editorial-post")) return;

  // Si cambias el tema mientras cargan los comentarios, Quarto puede enviar
  // el cambio demasiado pronto. Lo confirmamos cuando Giscus anuncia su tamaño.
  window.addEventListener("message", (event) => {
    if (event.origin !== "https://giscus.app" || !event.data?.giscus?.resizeHeight) return;
    const frame = document.querySelector(".giscus-frame");
    if (event.source !== frame?.contentWindow) return;
    const themeId = body.classList.contains("quarto-dark") ? "giscus-alt-theme" : "giscus-base-theme";
    const theme = document.getElementById(themeId)?.value;
    if (!theme || frame.dataset.blogTheme === theme) return;
    frame.dataset.blogTheme = theme;
    frame.contentWindow.postMessage({ giscus: { setConfig: { theme } } }, event.origin);
  });

  const content = document.getElementById("quarto-document-content");
  const titleBlock = document.getElementById("title-block-header");
  if (!content || !titleBlock || titleBlock.querySelector(".article-reading-time")) return;

  addReadingTime(content, titleBlock);
  content.querySelectorAll("figure").forEach(enableFigureZoom);

  function addReadingTime(content, titleBlock) {
    const contentText = content.innerText || "";
    const words = contentText.trim().split(/\s+/).filter(Boolean).length;
    // Es una estimación: 230 palabras por minuto, con un mínimo de un minuto.
    const minutes = Math.max(1, Math.round(words / 230));
    const readingTime = document.createElement("div");
    readingTime.className = "article-reading-time";
    readingTime.textContent = `${minutes} min de lectura`;

    const titleMetadata = titleBlock.querySelector(".quarto-title-meta");
    if (titleMetadata) {
      titleMetadata.insertAdjacentElement("afterend", readingTime);
    } else {
      titleBlock.appendChild(readingTime);
    }
  }

  function enableFigureZoom(figure, index) {
    // Conserva el mismo img/svg/canvas y su pie. Solo añade un contenedor
    // desplazable; .is-expanded activa el tamaño definido en article-figures.css.
    const media = figure.querySelector("img, svg, canvas");
    // Un enlace o un gráfico interactivo ya tiene su propia acción.
    if (!media || media.closest("a, .html-widget") || figure.parentElement.closest("figure")) return;
    figure.classList.add("article-figure");

    const viewport = document.createElement("div");
    viewport.className = "article-figure-viewport";
    viewport.id = `article-figure-${index + 1}`;
    viewport.setAttribute("role", "region");
    viewport.setAttribute("aria-label", `Gráfico ${index + 1} ampliado; usa las flechas para recorrerlo`);
    media.before(viewport);
    viewport.appendChild(media);

    const tools = document.createElement("div");
    tools.className = "article-figure-tools";
    const button = document.createElement("button");
    button.className = "article-figure-expand";
    button.type = "button";
    button.textContent = "Ampliar ↗";
    button.setAttribute("aria-controls", viewport.id);
    button.setAttribute("aria-expanded", "false");
    tools.appendChild(button);
    figure.appendChild(tools);

    const hint = document.createElement("span");
    hint.className = "article-figure-hint";
    hint.textContent = "Desliza o usa las flechas para recorrer el gráfico. Esc para volver.";
    hint.hidden = true;
    figure.appendChild(hint);

    function setExpanded(expanded) {
      // Estado visual, accesibilidad y foco cambian juntos, tanto con clic como con Esc.
      figure.classList.toggle("is-expanded", expanded);
      button.textContent = expanded ? "Reducir ↙" : "Ampliar ↗";
      button.setAttribute("aria-expanded", String(expanded));
      hint.hidden = !expanded || (viewport.scrollWidth <= viewport.clientWidth && viewport.scrollHeight <= viewport.clientHeight);
      // Solo el gráfico ampliado necesita otra parada de teclado.
      viewport.tabIndex = expanded ? 0 : -1;
      viewport.scrollTo(0, 0);
      if (expanded) viewport.focus({ preventScroll: true });
      else button.focus({ preventScroll: true });
      figure.scrollIntoView({ block: "nearest", behavior: "instant" });
    }

    button.addEventListener("click", () => setExpanded(!figure.classList.contains("is-expanded")));
    media.addEventListener("click", () => {
      if (!figure.classList.contains("is-expanded")) setExpanded(true);
    });
    figure.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && figure.classList.contains("is-expanded")) {
        event.preventDefault();
        setExpanded(false);
      }
    });
  }
})();
</script>
