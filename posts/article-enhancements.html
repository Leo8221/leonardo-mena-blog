<script>
(function () {
  const body = document.body;
  if (!body || !body.classList.contains("editorial-post")) return;

  const content = document.getElementById("quarto-document-content");
  const titleBlock = document.getElementById("title-block-header");
  if (!content || !titleBlock || titleBlock.querySelector(".article-reading-time")) return;

  const text = content.innerText || "";
  const words = text.trim().split(/\s+/).filter(Boolean).length;
  // Es una estimación: 230 palabras por minuto, con un mínimo de un minuto.
  const minutes = Math.max(1, Math.round(words / 230));
  const label = `${minutes} min de lectura`;
  const meta = document.createElement("div");
  meta.className = "article-reading-time";
  meta.textContent = label;

  const metaBlock = titleBlock.querySelector(".quarto-title-meta");
  if (metaBlock) {
    metaBlock.insertAdjacentElement("afterend", meta);
  } else {
    titleBlock.appendChild(meta);
  }

  const figureTargets = Array.from(content.querySelectorAll(
    ".quarto-figure, figure"
  )).filter((node) => {
    if (node.closest(".article-figure-modal")) return false;
    if (node.dataset.figureEnhanced === "true") return false;
    // Quarto envuelve figure en otro contenedor: añadimos un solo botón por gráfico.
    if (node.closest(".quarto-figure") && !node.classList.contains("quarto-figure")) return false;
    return node.querySelector("img, svg, canvas");
  });

  if (!figureTargets.length) return;

  const modal = document.createElement("dialog");
  modal.className = "article-figure-modal";
  modal.setAttribute("aria-labelledby", "article-figure-modal-title");
  modal.innerHTML = `
    <div class="article-figure-modal-head">
      <p class="article-figure-modal-title" id="article-figure-modal-title">Gráfico ampliado</p>
      <div class="article-figure-modal-actions">
        <button class="article-figure-zoom" type="button">Ampliar</button>
        <button class="article-figure-close" type="button" autofocus>Cerrar</button>
      </div>
    </div>
    <p class="article-figure-hint">Desliza el gráfico o usa las flechas para recorrerlo.</p>
    <div class="article-figure-viewport" tabindex="0" role="region" aria-label="Gráfico ampliado">
      <div class="article-figure-media"></div>
    </div>
    <p class="article-figure-caption"></p>
  `;
  document.body.appendChild(modal);

  const viewport = modal.querySelector(".article-figure-viewport");
  const mediaBox = modal.querySelector(".article-figure-media");
  const caption = modal.querySelector(".article-figure-caption");
  const hint = modal.querySelector(".article-figure-hint");
  const zoomButton = modal.querySelector(".article-figure-zoom");
  const closeButton = modal.querySelector(".article-figure-close");

  function setZoom(zoomed) {
    viewport.classList.toggle("is-zoomed", zoomed);
    zoomButton.textContent = zoomed ? "Ajustar" : "Ampliar";
    hint.hidden = !zoomed;
    viewport.scrollTo(0, 0);
  }

  function openModal(target) {
    const original = target.querySelector("img, svg, canvas");
    const clone = original.cloneNode(true);
    clone.removeAttribute("id");
    clone.removeAttribute("loading");
    // Un canvas clonado conserva sus dimensiones, pero no los píxeles dibujados.
    if (original instanceof HTMLCanvasElement) clone.getContext("2d").drawImage(original, 0, 0);
    mediaBox.replaceChildren(clone);
    caption.textContent = target.querySelector("figcaption")?.textContent.trim() || "";
    caption.hidden = !caption.textContent;
    // En móvil, ampliar debe aumentar el tamaño, no encoger otra vez la imagen.
    // El área se desplaza; el pie de figura y los botones permanecen a la vista.
    document.body.classList.add("no-scroll");
    modal.showModal();
    setZoom(window.matchMedia("(max-width: 680px)").matches);
  }

  zoomButton.addEventListener("click", () => setZoom(!viewport.classList.contains("is-zoomed")));
  closeButton.addEventListener("click", () => modal.close());
  modal.addEventListener("click", (event) => {
    if (event.target === modal) modal.close();
  });
  modal.addEventListener("close", () => {
    document.body.classList.remove("no-scroll");
    mediaBox.replaceChildren();
  });

  figureTargets.forEach((target) => {
    target.dataset.figureEnhanced = "true";
    const tools = document.createElement("div");
    tools.className = "article-figure-tools";
    const button = document.createElement("button");
    button.className = "article-figure-expand";
    button.type = "button";
    button.textContent = "Ampliar";
    button.setAttribute("aria-label", "Ampliar gráfico");
    tools.appendChild(button);
    target.insertBefore(tools, target.firstChild);
    button.addEventListener("click", () => openModal(target));
  });
})();
</script>
