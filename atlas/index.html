<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atlas</title>
  <meta name="description" content="Atlas de mapas, indicadores y secciones de economia aplicada.">
  <link rel="icon" href="../image/logo_leonardo_mena.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="atlas-app" data-view="overview">
    <aside class="atlas-sidebar" id="atlas-sidebar" aria-label="Navegacion del Atlas">
      <a class="brand-lockup" href="./" aria-label="Atlas">
        <span>
          <strong>Atlas</strong>
        </span>
      </a>

      <div class="search-box">
        <label for="atlas-search">Buscar modulo</label>
        <input id="atlas-search" type="search" placeholder="Comercio, sectores, precios...">
      </div>

      <div class="filter-group" aria-label="Filtros por familia">
        <button class="filter-pill is-active" type="button" data-filter="all">Todos</button>
        <button class="filter-pill" type="button" data-filter="Macro">Macro</button>
        <button class="filter-pill" type="button" data-filter="Sectores">Sectores</button>
        <button class="filter-pill" type="button" data-filter="Comercio">Comercio</button>
        <button class="filter-pill" type="button" data-filter="Trabajo">Trabajo</button>
        <button class="filter-pill" type="button" data-filter="Precios">Precios</button>
        <button class="filter-pill" type="button" data-filter="Territorio">Territorio</button>
        <button class="filter-pill" type="button" data-filter="Empresas">Empresas</button>
        <button class="filter-pill" type="button" data-filter="Visuales">Visuales</button>
      </div>

      <nav class="module-nav" id="module-nav" aria-label="Modulos del Atlas"></nav>

    </aside>

    <main class="atlas-main">
      <header class="atlas-topbar">
        <button class="menu-toggle" id="menu-toggle" type="button" aria-expanded="false" aria-controls="atlas-sidebar">Menu</button>
        <div class="topbar-title">
          <h1>Atlas</h1>
        </div>
        <div class="topbar-actions">
          <a href="../index.html">Blog</a>
          <a href="../secciones.html">Secciones</a>
        </div>
      </header>

      <section class="mobile-atlas-nav" aria-label="Navegacion movil del Atlas">
        <div class="mobile-filter-row" aria-label="Filtros por familia">
          <button class="filter-pill is-active" type="button" data-filter="all">Todos</button>
          <button class="filter-pill" type="button" data-filter="Macro">Macro</button>
          <button class="filter-pill" type="button" data-filter="Sectores">Sectores</button>
          <button class="filter-pill" type="button" data-filter="Comercio">Comercio</button>
          <button class="filter-pill" type="button" data-filter="Trabajo">Trabajo</button>
          <button class="filter-pill" type="button" data-filter="Precios">Precios</button>
          <button class="filter-pill" type="button" data-filter="Territorio">Territorio</button>
          <button class="filter-pill" type="button" data-filter="Empresas">Empresas</button>
          <button class="filter-pill" type="button" data-filter="Visuales">Visuales</button>
        </div>
        <nav class="mobile-module-nav" id="mobile-module-nav" aria-label="Vistas del Atlas"></nav>
      </section>

      <section class="metric-strip" id="metric-strip" aria-label="Indicadores principales"></section>

      <section class="workspace-grid">
        <section class="module-stage" id="module-stage" aria-live="polite"></section>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
