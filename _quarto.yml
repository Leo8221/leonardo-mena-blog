project:
  type: website
  output-dir: docs
  post-render: node atlas/scripts/ensure-sitemap.mjs
  render:
    - "*.qmd"
    - "!investigacion.qmd"
    - "!mitos-economicos.qmd"
    - "posts/**/*.qmd"
    - "!posts/republica-en-un-grafico/2026-05-05-mercado-laboral-censo/index.qmd"
    - "!posts/republica-habla-de/2026-05-04-efectos-segunda-ronda-petroleo/index.qmd"
    - "!research/**/*.qmd"
  resources: 
    - .nojekyll
    - robots.txt
    - tema_graficos.R
    - assets/css/tokens.css
    - assets/js/home-pulse.js
    - atlas/index.html
    - atlas/app.js
    - atlas/js/config.js
    - atlas/js/utils.js
    - atlas/js/chart-helpers.js
    - atlas/js/chart-tooltips.js
    - atlas/js/renderers.js
    - atlas/js/geo-utils.js
    - atlas/js/map-renderers.js
    - atlas/js/interactions.js
    - atlas/js/app-navigation.js
    - atlas/js/app-panels.js
    - atlas/js/app-modules.js
    - atlas/js/app-data.js
    - atlas/js/app-ui.js
    - atlas/js/bootstrap.js
    - atlas/js/tour.js
    - atlas/styles.css
    - atlas/css/base.css
    - atlas/css/layout.css
    - atlas/css/overview.css
    - atlas/css/charts.css
    - atlas/css/tables.css
    - atlas/css/sources.css
    - atlas/css/responsive.css
    - atlas/css/tour.css
    - atlas/data/atlas-data.json
    - atlas/data/article-visuals.json
    - atlas/data/rd-provinces.geojson
    - atlas/data/rd-regions-mipymes.geojson
    - atlas/data/world-tourism.geojson

lang: es 

# Configuración global del sitio
website:
  title: "Leonardo Mena"
  description: "Economía aplicada y datos de la República Dominicana"
  site-url: "https://leo8221.github.io/leonardo-mena-blog/"
  image: image/social-preview.png
  google-analytics: "G-W3JC0G3RJ1"
  favicon: image/logo_leonardo_mena.png
  search:
    location: navbar
    type: overlay
    limit: 5
    collapse-after: 1
    keyboard-shortcut: ["/"]


  # Barra de navegación
  navbar:
    title: false
    logo: image/logo_leonardo_mena.svg
    logo-alt: "Leonardo Mena - inicio"
    background: "#ffffff"
    left:
      - text: Análisis
        menu:
          - text: "La República habla de"
            href: republica-habla-de.qmd
          - text: "La República en un gráfico"
            href: republica-en-un-grafico.qmd
      - href: atlas/index.html
        text: "Atlas"
        icon: graph-up
      - text: Escuela
        menu:
          - text: "Mis predecesores"
            href: predecesores.qmd
          - text: "Fundamentos"
            href: fundamentos.qmd
      - text: Archivo
        menu:
          - text: "Archivo completo"
            href: archivo.qmd
          - text: "Categorías"
            href: categorias.qmd
          - text: "Secciones"
            href: secciones.qmd
      - href: about.qmd
        text: "Sobre mí"
    right:
      - text: "Suscríbete"
        href: suscribete.qmd
        aria-label: "Suscribirse al boletín"


  # Configuración para compartir en redes
  open-graph: true
  twitter-card: true

  # Pie de página
  page-footer:
    left: |
      <p class="footer-brand">© 2026 Leonardo Mena · Economía Aplicada</p>
    center: |
      <a href="https://leo8221.github.io/leonardo-mena-blog/about.html">Sobre m&iacute;</a> &middot;
      <a href="mailto:leonardomena824@gmail.com">Contacto</a>
    right: |
      <a href="https://x.com/leonardomena824" target="_blank" rel="noopener noreferrer" aria-label="X de Leonardo Mena"><i class="bi bi-twitter"></i></a> ·
      <a href="https://www.instagram.com/leonardomena824/" target="_blank" rel="noopener noreferrer" aria-label="Instagram de Leonardo Mena"><i class="bi bi-instagram"></i></a> ·
      <a href="https://www.linkedin.com/in/leonardo-mena-3b140724a/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn de Leonardo Mena"><i class="bi bi-linkedin"></i></a> ·
      <a href="https://github.com/Leo8221" target="_blank" rel="noopener noreferrer" aria-label="GitHub de Leonardo Mena"><i class="bi bi-github"></i></a>

format:
  html:
    theme: 
      light: cosmo
      dark: slate
    css: styles.css
    include-before-body: skip-link.html
    include-after-body: site-tour.html
    html-math-method: katex
    lazy-load: true
    toc: true            
    toc-title: "En este artículo"
    smooth-scroll: true
    link-external-newwindow: true
    code-copy: true      
    highlight-style: github
    
execute:
  freeze: auto
  warning: false
  message: false

# Calidad de gráficos
knitr:
  opts_chunk:
    dev: "ragg_png"
    collapse: true
