author: "Leonardo Mena"
# Se hereda en todos los index.qmd de posts/. El progreso y compartir se cargan
# al final de la página, cuando ya existe el contenido al que añaden controles.
include-after-body:
  - ../reading-progress.html
  - ../share-buttons-auto.html

format:
  html:
    toc: true
    toc-location: left
    body-classes: editorial-post
    # Esta clase conecta el artículo con assets/css/site/article-*.css.
    include-after-body: article-enhancements.html

comments: 
  giscus:
    repo: Leo8221/leonardo-mena-blog
    repo-id: R_kgDOQmnpWw
    category: General 
    category-id: DIC_kwDOQmnpW84CzuJe
    mapping: title
    reactions-enabled: true
    theme: 
      light: light             
      dark: dark_high_contrast
    input-position: top
    loading: lazy
    language: es
