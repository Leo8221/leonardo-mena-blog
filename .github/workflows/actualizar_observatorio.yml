name: Actualizar Observatorio

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-blog:
    runs-on: ubuntu-latest

    env:
      RENV_CONFIG_PAK_ENABLED: true

    steps:
      - name: Chequear código
        uses: actions/checkout@v4

      - name: Instalar Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Instalar R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      # 🔥 Necesario para sf y mapas
      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libgdal-dev \
            libgeos-dev \
            libproj-dev \
            libudunits2-dev

      # ⚡ Cache inteligente de paquetes R
      - name: Instalar y cachear paquetes R
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::tidyverse
            any::highcharter
            any::readxl
            any::lubridate
            any::httr
            any::janitor
            any::DT
            any::htmltools
            any::bslib
            any::bsicons
            any::rmarkdown
            any::knitr
            any::here
            any::showtext
            any::scales
            any::patchwork
            any::ggrepel
            any::sf
            any::stringi
            any::tidyquant
            any::rnaturalearth
            any::rnaturalearthdata
            any::treemapify

      # 🧹 Limpieza fuerte de caches de render
      - name: Limpiar caches de Quarto
        run: |
          rm -rf _freeze/
          rm -rf observatorio_cache/
          rm -rf *_cache/

      # 🏗 Render completo
      - name: Renderizar Proyecto
        run: quarto render --no-cache

      # 🚀 Commit automático solo si hay cambios
      - name: Guardar cambios
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "⚠️ Sin cambios"
          else
            git commit -m "🔄 Auto-update: $(date +'%Y-%m-%d %H:%M UTC')"
            git push
            echo "✅ Publicado"
          fi