<script>
(function () {
  if (window.__lmShareButtonsReady) {
    return;
  }
  window.__lmShareButtonsReady = true;

  function cleanUrl(rawUrl) {
    const url = new URL(rawUrl, window.location.href);
    url.hash = "";

    if (url.pathname.endsWith("/index.html")) {
      url.pathname = url.pathname.slice(0, -"/index.html".length) || "/";
    }

    return url.toString().replace(/\/$/, "");
  }

  function getShareData() {
    const title =
      document.querySelector("h1.title")?.textContent?.trim() ||
      document.querySelector("h1")?.textContent?.trim() ||
      document.title.trim();

    const canonical = document.querySelector('link[rel="canonical"]')?.href;

    return {
      title,
      url: cleanUrl(canonical || window.location.href)
    };
  }

  function shareUrl(platform, data) {
    const encodedUrl = encodeURIComponent(data.url);
    const encodedTitle = encodeURIComponent(data.title);

    if (platform === "twitter") {
      return `https://twitter.com/intent/tweet?text=${encodedTitle}&url=${encodedUrl}`;
    }

    if (platform === "linkedin") {
      return `https://www.linkedin.com/sharing/share-offsite/?url=${encodedUrl}`;
    }

    if (platform === "whatsapp") {
      return `https://wa.me/?text=${encodeURIComponent(`${data.title}\n\n${data.url}`)}`;
    }

    return "";
  }

  function shareLabel(platform) {
    if (platform === "twitter") return "Compartir en X";
    if (platform === "linkedin") return "Compartir en LinkedIn";
    if (platform === "whatsapp") return "Compartir por WhatsApp";
    return "Compartir";
  }

  function setFeedback(container, message) {
    let feedback = container.querySelector("[data-share-feedback]");

    if (!feedback) {
      feedback = document.createElement("span");
      feedback.className = "share-copy-feedback";
      feedback.setAttribute("data-share-feedback", "");
      feedback.setAttribute("role", "status");
      feedback.setAttribute("aria-live", "polite");
      container.appendChild(feedback);
    }

    feedback.textContent = message;
    window.clearTimeout(feedback._lmTimeout);
    feedback._lmTimeout = window.setTimeout(function () {
      feedback.textContent = "";
    }, 2200);
  }

  function showManualCopy(container, url) {
    let wrapper = container.querySelector("[data-share-manual-copy]");

    if (!wrapper) {
      wrapper = document.createElement("span");
      wrapper.className = "share-manual-copy";
      wrapper.setAttribute("data-share-manual-copy", "");

      const input = document.createElement("input");
      input.type = "text";
      input.readOnly = true;
      input.setAttribute("aria-label", "Enlace para copiar manualmente");
      wrapper.appendChild(input);
      container.appendChild(wrapper);
    }

    const input = wrapper.querySelector("input");
    input.value = url;
    input.focus();
    input.select();
  }

  async function copyText(text) {
    if (navigator.clipboard?.writeText) {
      try {
        await navigator.clipboard.writeText(text);
        return;
      } catch (error) {
        // Fall back to a temporary selection when browser permissions block Clipboard API.
      }
    }

    const textArea = document.createElement("textarea");
    textArea.value = text;
    textArea.setAttribute("readonly", "");
    textArea.style.position = "fixed";
    textArea.style.top = "0";
    textArea.style.left = "-9999px";
    textArea.style.opacity = "0";
    document.body.appendChild(textArea);
    textArea.focus();
    textArea.select();
    textArea.setSelectionRange(0, text.length);
    const copied = document.execCommand("copy");
    textArea.remove();

    if (!copied) {
      throw new Error("copy_failed");
    }
  }

  function addUtilityButtons(container, data) {
    if (container.dataset.shareUtilitiesReady === "true") {
      return;
    }

    const controls = document.createElement("span");
    controls.className = "share-extra-controls";

    if (navigator.share) {
      const nativeButton = document.createElement("button");
      nativeButton.type = "button";
      nativeButton.className = "share-native-button";
      nativeButton.textContent = "Compartir";
      nativeButton.setAttribute("aria-label", "Compartir este artículo");
      nativeButton.addEventListener("click", async function () {
        try {
          await navigator.share({ title: data.title, url: data.url });
        } catch (error) {
          if (error?.name !== "AbortError") {
            setFeedback(container, "No se pudo compartir");
          }
        }
      });
      controls.appendChild(nativeButton);
    }

    const copyButton = document.createElement("button");
    copyButton.type = "button";
    copyButton.className = "share-copy-button";
    copyButton.textContent = "Copiar enlace";
    copyButton.setAttribute("aria-label", "Copiar enlace del artículo");
    copyButton.addEventListener("click", async function () {
      try {
        await copyText(data.url);
        setFeedback(container, "Enlace copiado");
      } catch (error) {
        showManualCopy(container, data.url);
        setFeedback(container, "Enlace listo para copiar");
      }
    });
    controls.appendChild(copyButton);

    container.appendChild(controls);
    container.dataset.shareUtilitiesReady = "true";
  }

  function setupShareButtons() {
    const data = getShareData();
    const shareButtons = document.querySelectorAll("[data-share]");

    shareButtons.forEach(function (element) {
      const platform = element.getAttribute("data-share");
      const url = shareUrl(platform, data);

      if (!url) {
        return;
      }

      element.setAttribute("href", url);
      element.setAttribute("target", "_blank");
      element.setAttribute("rel", "noopener noreferrer");
      element.setAttribute("aria-label", shareLabel(platform));
      element.setAttribute("title", shareLabel(platform));
      element.removeAttribute("data-original-href");
    });

    document.querySelectorAll(".share-minimal").forEach(function (container) {
      addUtilityButtons(container, data);
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", setupShareButtons, { once: true });
  } else {
    setupShareButtons();
  }
})();
</script>
